name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: true
      - name: git-bash-on-path
        if: runner.os == 'Windows'
        # bash, sleep, and seq live in Git\usr\bin (see the bash.EXE
        # path in any shell step log). One entry per call: embedded
        # newlines do not split GITHUB_PATH entries.
        run: |
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\usr\bin'
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
          where.exe bash
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: race
        # The race detector needs cgo, which the Windows runner does not
        # provide. Linux and macOS match the local ./scripts/check.sh gate.
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: acceptance-profiles
        # PLAN4 P4-034: the idle, metadata, and compacted-session profiles are
        # part of the delivered evidence, not only local measurements.
        if: runner.os != 'Windows'
        run: go test -tags acceptance ./internal/app -run 'TestTenIdleSecondsProduceNoScheduledFrames|TestScale10000MetadataFirstPage|TestScale512MiBActivation' -count=1 -v
      - name: build
        run: go build ./...
