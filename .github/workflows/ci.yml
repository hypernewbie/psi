name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
          # Keep checksum-based keys; setup-go v7 defaults to go.mod.
          cache-dependency-path: go.sum
      - name: go-version
        run: go version
      - name: git-bash-on-path
        if: runner.os == 'Windows'
        # bash, sleep, and seq live in Git\usr\bin (see the bash.EXE
        # path in any shell step log). One entry per call: embedded
        # newlines do not split GITHUB_PATH entries.
        run: |
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\usr\bin'
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
          where.exe bash
      - name: check
        if: runner.os != 'Windows'
        run: go tool dev check
      - name: check-windows
        if: runner.os == 'Windows'
        run: go tool dev check --skip-race
      - name: wrapper-smoke
        shell: bash
        run: |
          set -eu
          state="$RUNNER_TEMP/psi-dev-smoke"
          exe=""
          if [ "$RUNNER_OS" = Windows ]; then
            state="$(cygpath -u "$state")"
            exe=".exe"
          fi
          # Refuse an occupied task path instead of deleting it.
          mkdir "$state"
          mkdir "$state/install with spaces" "$state/existing bake target"
          printf 'keep\n' > "$state/expected"
          printf 'keep\n' > "$state/existing bake target/sentinel.txt"
          install_dir="$state/install with spaces"
          if [ "$RUNNER_OS" = Windows ]; then
            install_dir="$(cygpath -w "$install_dir")"
          fi
          go tool dev check --no-js-only
          go tool dev build
          "./psi$exe" --version
          go tool dev run --help > "$state/help.out"
          grep -F 'Usage:' "$state/help.out"
          GOBIN="$install_dir" go tool dev install
          "$state/install with spaces/psi$exe" --version
          if go tool dev bake "$state/existing bake target" > "$state/bake.out" 2> "$state/bake.err"; then
            printf '%s\n' 'bake unexpectedly accepted an existing destination' >&2
            exit 1
          fi
          grep -F 'already exists' "$state/bake.err"
          cmp "$state/expected" "$state/existing bake target/sentinel.txt"
