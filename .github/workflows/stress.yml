name: stress

# Timing and resource profiles are environment-sensitive: a shared runner
# under load can miss a wall-clock budget without any product change. They
# therefore run on a weekly schedule or on demand, never on every push.
# Routine per-push coverage stays in ci.yml and must remain deterministic.

on:
  schedule:
    # Mondays 05:00 UTC.
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  profiles:
    # Windows has no cgo, so the tagged profiles are Unix-only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
          # Keep checksum-based keys; setup-go v7 defaults to go.mod.
          cache-dependency-path: go.sum
      - name: tagged-acceptance
        # PLAN2/PLAN4/PLAN5 resource profiles: idle frames, 10k metadata
        # first page, and the 512 MiB compacted-session activation.
        run: go test -tags acceptance ./internal/app -count=1 -v
      - name: mcp-http-binary-acceptance
        shell: bash
        run: |
          set -eu
          go build -o "$RUNNER_TEMP/psi-mcp" .
          go test -tags acceptance ./internal/app -run '^TestMCPHTTPAcceptance$' -count=1 \
            -args -psi-test-binary="$RUNNER_TEMP/psi-mcp"
      - name: tagged-drain
        # Keep pipe-drain watchdogs and idle-grace profiles out of per-push CI.
        run: go test -tags acceptance ./internal/tools ./internal/mcp -count=1 -v
